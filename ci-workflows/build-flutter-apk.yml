name: Build Pure Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-apk:
    name: Build Pure Flutter APK (120 FPS Native)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform (AGP 8+ & v2 Embedding)
        run: |
          cd flutter_termobot
          rm -rf android
          flutter create . --platforms=android --org com.termobot
          flutter pub get
          # AGP 8+ namespace safety guard: ensure no package attribute in AndroidManifest
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/package="[^"]*"//g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build Release APK
        run: |
          cd flutter_termobot
          flutter build apk --release

      - name: Upload Flutter Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermoBot-Pure-Flutter-Release-APK
          path: flutter_termobot/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
